name: qr_code_studio_mobile
description: "QR Code Studio - Minimal QR Code Generator & Scanner Mobile App"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  qr: ^3.0.2
  mobile_scanner: ^7.5.0
  image_picker: ^1.2.4
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  gal: ^2.3.3
  in_app_update: ^4.2.5
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
