name: yt_downloader_mobile
description: "YouTube Downloader Studio - HD Video, HQ Audio, Thumbnails & Subtitles Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  youtube_explode_dart: ^3.1.0
  http: ^1.6.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  gal: ^3.0.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
